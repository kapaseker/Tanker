[package]
name = "leovox-astra-h-preview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "leovox_astrah"
path = "preview.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  # default_app
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "reflect_auto_register",
  # 平台（无 gilrs / wayland / webgl / sysinfo）
  "multi_threaded",
  "bevy_winit",
  "x11",
  "default_font",
  # 字体资产加载与文本排版（Font / FontLoader）
  "bevy_text",
  # 主菜单 2D 界面（节点布局、文本、Interaction 拾取）
  "bevy_ui",
  # 0.20 起 UI 渲染独立成插件（bevy_ui 只含布局/焦点），缺它则 UI 完全不可见
  "bevy_ui_render",
  # BSN 场景宏（HUD 迁移引入）；ScenePlugin 随 DefaultPlugins 自动注册
  "bevy_scene",
  # 离屏关键帧使用 PNG 编码；复用 Bevy 已有图像依赖。
  "png",
  # 3D 渲染管线
  "3d_api",
  "3d_bevy_render",
] }
bevy_vox_scene = "=0.23.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
