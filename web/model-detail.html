<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型详情 · V-Tank</title>
<meta name="description" content="V-Tank 模型详情：拖拽旋转查看模型并展示三维尺寸。">
<meta name="theme-color" content="#0f0e0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f0e0c'/%3E%3Cpath d='M16 5l11 6-11 6-11-6z' fill='%23e2edcf'/%3E%3Cpath d='M5 11v9l11 6v-9z' fill='%23b7cb9f'/%3E%3Cpath d='M27 11v9l-11 6v-9z' fill='%2391a97a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="scale.js"></script>
<script src="transition.js"></script>
</head>
<body class="page-detail">
  <div class="bg" aria-hidden="true">
    <div class="bg__glow"></div>
    <div class="bg__floor"></div>
    <div class="bg__scan"></div>
    <div class="bg__vignette"></div>
  </div>

  <div class="frame" aria-hidden="true"></div>

  <header class="backbar">
    <!-- 返回地址由脚本补上 #编号，保证回画廊后聚焦原卡片 -->
    <a class="back" href="model-gallery.html" id="detail-back" aria-label="返回模型画廊">
      <span class="back__arrow" aria-hidden="true">←</span> <kbd>ESC</kbd>
    </a>
    <h1 class="backbar__title" id="detail-name">—</h1>
  </header>

  <main class="stage">
    <!-- 模型详情：鼠标拖拽旋转查看，三维尺寸以模型边沿的尺寸轴标注 -->
    <div class="screen is-active" id="screen-detail">
      <div class="detail">
        <div class="viewer" id="viewer" aria-label="模型查看区，按住鼠标拖拽可旋转模型"></div>

        <!-- 三维尺寸改由模型边沿的三条尺寸轴标注（见下方脚本）；
             左侧仅保留分类眉题，其余为占位参数行：样式与信息行一致，字段待玩法确定后替换 -->
        <div class="specs">
          <div class="specs__id">
            <p class="eyebrow" id="detail-cat">坦克</p>
          </div>
          <!-- 占位值仅用于核对版式与字号，非真实数据 -->
          <div class="spec">
            <span class="spec__label">质量</span>
            <span class="spec__row"><span class="spec__value">32.4</span><span class="spec__unit">吨</span></span>
          </div>
          <div class="spec">
            <span class="spec__label">装甲</span>
            <span class="spec__row"><span class="spec__value">45</span><span class="spec__unit">毫米</span></span>
          </div>
          <div class="spec">
            <span class="spec__label">极速</span>
            <span class="spec__row"><span class="spec__value">56</span><span class="spec__unit">千米/时</span></span>
          </div>
        </div>

        <!-- 尺寸轴为纯图形标注，同步提供文字替代 -->
        <p class="sr-only" id="detail-dims-sr"></p>
      </div>
    </div>
  </main>

  <footer class="hud hud--bottom">
    <span class="hud__hint"></span>
    <span class="hud__hint"></span>
    <span class="hud__build">版本 0.1.0</span>
  </footer>

  <script src="models.js"></script>
  <script>
    (() => {
      // ---------- 通过 URL 参数定位模型：?c=分类下标&m=模型下标 ----------
      const params = new URLSearchParams(location.search);
      // 缺失的参数 get 返回 null，Number(null) 是 0，必须先判断存在性
      const ci = params.has('c') && params.has('m') ? Number(params.get('c')) : NaN;
      const mi = Number(params.get('m'));
      const category = CATEGORIES[Number.isInteger(ci) ? ci : -1];
      const model = category?.models[Number.isInteger(mi) ? mi : -1];
      // 参数缺失或非法（含直接打开裸链接）时回画廊
      if (!model) {
        location.replace('model-gallery.html');
        return;
      }

      const back = document.getElementById('detail-back');
      // 型号 = 分类代码-编号（如 BR-01），与画廊卡片编号一致
      const modelCode = modelCardId(category, mi);
      // 带锚点返回画廊，画廊据此聚焦原卡片；同时更新标签页标题
      back.href = `model-gallery.html#${modelCode}`;
      document.title = `${modelCode} · V-Tank`;

      document.getElementById('detail-cat').textContent = category.name;
      document.getElementById('detail-name').textContent = modelCode;

      // ---------- 查看区：拖拽旋转 + 滚轮缩放 ----------
      const viewer = document.getElementById('viewer');
      // 初始为三分之四视角；全屏查看区更大，基准缩放同步提高
      let yaw = -28;
      let pitch = -14;
      let zoom = 2.4;

      // 详情页模型由 JS 直接写 transform，缩放与旋转合并应用
      const detailModel = buildModel(model);
      // 伴随子弹只作组合示意展示，尺寸轴的包围盒只读 parts，不把子弹计入
      attachBullet(detailModel, model);
      viewer.append(detailModel);

      // ---------- 三维尺寸轴：贴合模型包围盒边沿的工程标注 ----------
      // 轴线、端点刻度与延长线都是 .model 的子元素，天然跟随同一套旋转/缩放；
      // 尺寸标签挂在查看区 2D 层，逐帧把轴上锚点投影为屏幕坐标：
      // 字号恒定、不被模型切面遮挡或透视镜像，任意姿态下保持可读。
      const AXIS = 'rgba(200, 219, 177, 0.9)';        // 主轴线
      const TICK_COLOR = 'rgba(232, 244, 218, 0.95)'; // 端点刻度
      const EXT = 'rgba(200, 219, 177, 0.30)';        // 角点延长线
      const GAP = 14;      // 轴线与模型边沿的间距（模型空间 px，随缩放同步变化）
      const HALF_TICK = 7; // 端点刻度半长（模型空间 px）

      // 在模型空间画一条线段。kind 决定线段所在平面与延伸方向：
      // gx：地面平面沿 X；gz：地面平面沿 Z；vx：竖直面(朝+Z)沿 Y；vz：竖直面(朝+X)沿 Y
      function seg(kind, x, y, z, len, color) {
        const el = document.createElement('div');
        el.className = 'dims__seg';
        el.style.background = color;
        if (kind === 'gx') {
          el.style.width = `${len}px`;
          el.style.height = '1px';
          el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(90deg)`;
        } else if (kind === 'gz') {
          el.style.width = `${len}px`;
          el.style.height = '1px';
          el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateX(90deg) rotateZ(90deg)`;
        } else if (kind === 'vx') {
          el.style.width = '1px';
          el.style.height = `${len}px`;
          el.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
        } else {
          el.style.width = '1px';
          el.style.height = `${len}px`;
          el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(90deg)`;
        }
        return el;
      }

      // 竖直线的十字截面：两个互相垂直的细面叠成一条线，任意偏航角下都不会侧边消失
      function vseg(x, y, z, len, color) {
        const frag = document.createDocumentFragment();
        frag.append(seg('vx', x, y, z, len, color), seg('vz', x, y, z, len, color));
        return frag;
      }

      // 计算部件盒并集 → 模型空间包围盒（px，原点为 body 中心，Y 轴向下）
      function bboxOf(m) {
        const b = { x0: 0, x1: 0, y0: 0, y1: 0, z0: 0, z1: 0 };
        for (const p of m.parts) {
          b.x0 = Math.min(b.x0, (p.x || 0) - p.w / 2);
          b.x1 = Math.max(b.x1, (p.x || 0) + p.w / 2);
          b.y0 = Math.min(b.y0, (p.y || 0) - p.h / 2);
          b.y1 = Math.max(b.y1, (p.y || 0) + p.h / 2);
          b.z0 = Math.min(b.z0, (p.z || 0) - p.d / 2);
          b.z1 = Math.max(b.z1, (p.z || 0) + p.d / 2);
        }
        return b;
      }

      function buildDimAxes(m) {
        const b = bboxOf(m);
        const yG = b.y1 + GAP; // 轴线地面：模型最低点再向下偏移 GAP
        const group = document.createElement('div');
        group.className = 'dims';
        group.setAttribute('aria-hidden', 'true');
        const tags = [];

        // 长度轴：前缘正下方沿 X；宽度轴：右缘正下方沿 Z；两者在右前下角相接
        group.append(
          seg('gx', b.x0, yG, b.z1, b.x1 - b.x0, AXIS),
          seg('gz', b.x1, yG, b.z0, b.z1 - b.z0, AXIS),
        );
        // 长度轴端点刻度 + 角点向下引出的延长线
        for (const xe of [b.x0, b.x1]) {
          group.append(seg('gz', xe, yG, b.z1 - HALF_TICK, HALF_TICK * 2, TICK_COLOR));
          group.append(vseg(xe, b.y1, b.z1, GAP, EXT));
        }
        // 宽度轴端点刻度 + 延长线（右前角延长线已由长度轴画出，跳过）
        for (const ze of [b.z0, b.z1]) {
          group.append(seg('gx', b.x1 - HALF_TICK, yG, ze, HALF_TICK * 2, TICK_COLOR));
          if (ze !== b.z1) group.append(vseg(b.x1, b.y1, ze, GAP, EXT));
        }
        // 高度轴：右前角外侧沿 Y；上下端由水平延长线引自模型角点，刻度取十字两向
        group.append(vseg(b.x1 + GAP, b.y0, b.z1, b.y1 - b.y0, AXIS));
        for (const ye of [b.y0, b.y1]) {
          group.append(seg('gx', b.x1, ye, b.z1, GAP, EXT));
          group.append(seg('gx', b.x1 + GAP - HALF_TICK, ye, b.z1, HALF_TICK * 2, TICK_COLOR));
          group.append(seg('gz', b.x1 + GAP, ye, b.z1 - HALF_TICK, HALF_TICK * 2, TICK_COLOR));
        }

        // 尺寸标签锚点：长度/宽度钉在各自轴线中点，高度钉在轴外侧中点
        const [lenM, widM, hgtM] = m.dims;
        function tag(name, value, x, y, z) {
          const el = document.createElement('span');
          el.className = 'dims__tag';
          el.innerHTML =
            `<span class="dims__name">${name}</span>` +
            `<span class="dims__val">${value}</span><span class="dims__unit">米</span>`;
          tags.push({ el, x, y, z });
        }
        tag('长度', lenM, (b.x0 + b.x1) / 2, yG, b.z1);
        tag('宽度', widM, b.x1, yG, (b.z0 + b.z1) / 2);
        tag('高度', hgtM, b.x1 + GAP + 16, (b.y0 + b.y1) / 2, b.z1);
        return { group, tags };
      }

      const axes = buildDimAxes(model);
      detailModel.append(axes.group);
      // 标签挂在查看区（.model 的兄弟节点），绘制顺序在模型之上
      for (const { el } of axes.tags) viewer.append(el);
      document.getElementById('detail-dims-sr').textContent =
        `长度 ${model.dims[0]} 米，宽度 ${model.dims[1]} 米，高度 ${model.dims[2]} 米`;

      const PERSPECTIVE = 1000; // 与 .viewer 的 perspective 保持一致
      const LABEL_PUSH = 36;    // 标签沿离心方向推开的屏幕距离（px），避免压住模型

      // 模型空间点 → 查看区屏幕坐标：复现 .model 的 rotateY→rotateX→scale
      // 变换与浏览器 perspective 投影，让标签钉住轴上锚点的屏幕位置
      function projectToScreen(x, y, z) {
        const ay = yaw * Math.PI / 180;
        const ax = pitch * Math.PI / 180;
        const x1 = x * Math.cos(ay) + z * Math.sin(ay);
        const z1 = -x * Math.sin(ay) + z * Math.cos(ay);
        const y2 = y * Math.cos(ax) - z1 * Math.sin(ax);
        const z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
        const f = PERSPECTIVE / (PERSPECTIVE - z2 * zoom);
        return { x: x1 * zoom * f, y: y2 * zoom * f };
      }

      function renderDetailModel() {
        detailModel.style.transform =
          `scale(${zoom}) rotateX(${pitch}deg) rotateY(${yaw}deg)`;
        // 标签定位：投影轴上锚点后沿“锚点→屏幕外侧”方向推开 LABEL_PUSH，
        // 旋转与缩放时跟随锚点移动；字号不随 zoom 缩放，保证可读
        const cx = viewer.clientWidth / 2;
        const cy = viewer.clientHeight / 2;
        for (const { el, x, y, z } of axes.tags) {
          const p = projectToScreen(x, y, z);
          const len = Math.hypot(p.x, p.y);
          const k = len > 1 ? LABEL_PUSH / len : 0;
          el.style.transform =
            `translate(${cx + p.x * (1 + k)}px, ${cy + p.y * (1 + k)}px) translate(-50%, -50%)`;
        }
      }
      renderDetailModel();

      // 指针拖拽：水平改 yaw，垂直改 pitch（限位防止翻面丢失立体感）
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      viewer.addEventListener('pointerdown', (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        viewer.classList.add('is-dragging');
        viewer.setPointerCapture(event.pointerId);
      });

      viewer.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        yaw += (event.clientX - lastX) * 0.45;
        pitch = Math.max(-80, Math.min(80, pitch - (event.clientY - lastY) * 0.45));
        lastX = event.clientX;
        lastY = event.clientY;
        renderDetailModel();
      });

      function endDrag(event) {
        dragging = false;
        viewer.classList.remove('is-dragging');
        if (event.pointerId !== undefined && viewer.hasPointerCapture(event.pointerId)) {
          viewer.releasePointerCapture(event.pointerId);
        }
      }

      viewer.addEventListener('pointerup', endDrag);
      viewer.addEventListener('pointercancel', endDrag);

      // 滚轮缩放，限制在可读范围内
      viewer.addEventListener('wheel', (event) => {
        event.preventDefault();
        zoom = Math.max(1.2, Math.min(3.6, zoom * (event.deltaY > 0 ? 0.92 : 1.08)));
        renderDetailModel();
      }, { passive: false });

    })();
  </script>


</body></html>
