<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战斗 HUD · 装填 · V-Tank</title>
<meta name="description" content="V-Tank 游戏内战斗 HUD 设计稿：空格开火触发后坐与炮口火光，装填进度叠加在真实开局画面上，完毕后收起并允许再次开火。">
<meta name="theme-color" content="#0f0e0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f0e0c'/%3E%3Cpath d='M16 5l11 6-11 6-11-6z' fill='%23e2edcf'/%3E%3Cpath d='M5 11v9l11 6v-9z' fill='%23b7cb9f'/%3E%3Cpath d='M27 11v9l-11 6v-9z' fill='%2391a97a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="scale.js"></script>
</head>
<body>
  <!-- 底图为游戏实际开局画面（离屏 1280×720 截取），HUD 直接叠加在真实构图上验证可读性 -->
  <div class="battle" aria-hidden="true">
    <div class="battle__shake" id="scene">
      <img class="battle__scene" src="scene-combat.webp" alt="">
      <!-- 炮口火光锚在截图中的炮管末端 -->
      <div class="battle__flash" id="muzzle"></div>
    </div>
    <div class="battle__vignette"></div>
    <div class="battle__scan"></div>
  </div>

  <!-- 装填进度条：贴在玩家炮台右侧，分格显示装填进度；满格即消失。
       外层取景盒与场景 cover 区域同尺寸，4:3 或超宽窗口下仍对齐炮台 -->
  <div class="hudbox">
    <section class="reload" id="reload" role="progressbar" aria-label="装填进度"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true">
      <div class="reload__track">
        <div class="reload__fill" id="reload-fill"></div>
        <div class="reload__ticks" aria-hidden="true"></div>
      </div>
    </section>
  </div>

  <script>
    (() => {
      // ---------- 装填状态 ----------
      // 装填时长取自 lance 射速 12 发/分钟 → 5 秒，与 src/gameplay/combat/firing.rs 的发射间隔一致；
      // 进度条固定 5 格（.reload__ticks 每格 20%），一格即 1 秒，射速变化时两处需同步
      const RELOAD_MS = 5000;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const plate = document.getElementById('reload');
      const fill = document.getElementById('reload-fill');
      const scene = document.getElementById('scene');
      const muzzle = document.getElementById('muzzle');

      let loading = false;
      let startedAt = 0;
      let raf = 0;
      let kickTimer = 0;
      let lastPercent = -1;

      // 逐帧用真实时间推进：填充比例和可开火状态都来自同一份冷却计时
      function tick(now) {
        const elapsed = Math.min(RELOAD_MS, now - startedAt);
        const progress = elapsed / RELOAD_MS;
        fill.style.width = `${(progress * 100).toFixed(2)}%`;

        const percent = Math.round(progress * 100);
        if (percent !== lastPercent) {
          lastPercent = percent;
          plate.setAttribute('aria-valuenow', String(percent));
        }

        if (progress >= 1) {
          finish();
          return;
        }
        raf = requestAnimationFrame(tick);
      }

      function fire() {
        if (loading) return;
        loading = true;
        startedAt = performance.now();
        lastPercent = -1;

        // 进入装填：进度条立即出现，从 0 开始
        plate.classList.add('is-visible');
        plate.removeAttribute('aria-hidden');
        plate.setAttribute('aria-valuenow', '0');
        fill.style.width = '0%';

        shoot();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(tick);
      }

      // 满格即收起进度条，不显示任何完成文字
      function finish() {
        loading = false;
        fill.style.width = '100%';
        plate.setAttribute('aria-valuenow', '100');
        plate.classList.remove('is-visible');
        plate.setAttribute('aria-hidden', 'true');
      }

      // 开火反馈：截图画面的短促下坐 + 炮口火光；减少动态偏好下只保留进度板
      function shoot() {
        if (reduceMotion) return;
        clearTimeout(kickTimer);
        scene.classList.add('is-kick');
        muzzle.classList.add('is-firing');
        kickTimer = setTimeout(() => {
          scene.classList.remove('is-kick');
          muzzle.classList.remove('is-firing');
        }, 260);
      }

      // 空格开火；装填期间按下不发射
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat) return;
        event.preventDefault();
        fire();
      });
    })();
  </script>
</body></html>
