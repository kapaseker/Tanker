<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-Tank</title>
<meta name="description" content="V-Tank — 体素装甲战场。驾驶履带战车穿越荒原，瞄准、开火、击毁目标。">
<meta name="theme-color" content="#0f0e0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f0e0c'/%3E%3Cpath d='M16 5l11 6-11 6-11-6z' fill='%23e2edcf'/%3E%3Cpath d='M5 11v9l11 6v-9z' fill='%23b7cb9f'/%3E%3Cpath d='M27 11v9l-11 6v-9z' fill='%2391a97a'/%3E%3C/svg%3E">
<style>
  /* 工程自带的 MiSans 可变字体，权重 100–900，页面所有文字统一使用 */
  @font-face {
    font-family: "MiSans";
    src: url("../assets/fonts/misans/MiSansVF.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #0f0e0c;
    --ink: #ebe8df;
    --muted: #a49d90;
    --line: rgba(235, 232, 223, 0.15);
    --mint: #c8dbb1;
    --mint-bright: #eaf4da;
    --mint-deep: #9db67e;
    --dark: #12110d;
    --font-display: "MiSans", "Microsoft YaHei", sans-serif;
    --font-body: "MiSans", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "MiSans", "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin:0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景层：沙色余光、地面网格、体素块 ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg__glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(90% 70% at 82% 108%, rgba(150, 116, 82, 0.42), transparent 62%),
      radial-gradient(55% 45% at 88% 2%, rgba(200, 219, 177, 0.10), transparent 70%);
  }

  .bg__floor {
    position: absolute;
    left: -22%;
    right: -22%;
    bottom: -14%;
    height: 56%;
    background-image:
      linear-gradient(rgba(200, 219, 177, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 219, 177, 0.10) 1px, transparent 1px);
    background-size: 62px 62px;
    transform: perspective(520px) rotateX(66deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 12%, transparent 82%);
    mask-image: linear-gradient(to top, #000 12%, transparent 82%);
    opacity: 0.6;
  }

  .voxels {
    flex: 0 0 auto;
    width: clamp(260px, 30vw, 420px);
    height: auto;
    opacity: 0.95;
    pointer-events: none;
    filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.45));
  }

  .drift {
    animation: drift 7s ease-in-out infinite;
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  .bg__vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.62));
  }

  .bg__scan {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
    opacity: 0.22;
  }

  /* ---------- 页面四角标记 ---------- */
  .frame {
    position: fixed;
    inset: 18px;
    z-index: 2;
    pointer-events: none;
  }

  .frame::before,
  .frame::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px solid rgba(200, 219, 177, 0.38);
  }

  .frame::before {
    top: 0;
    left: 0;
    border-right: 0;
    border-bottom: 0;
  }

  .frame::after {
    right: 0;
    bottom: 0;
    border-left: 0;
    border-top: 0;
  }

  /* ---------- 顶部 / 底部 HUD ---------- */
  .hud {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.9rem clamp(1.4rem, 4.5vw, 3.4rem);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hud__tag {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    color: var(--ink);
  }

  .hud__tag::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--mint);
    box-shadow: 0 0 0 1px rgba(200, 219, 177, 0.25), 0 0 12px rgba(200, 219, 177, 0.5);
  }

  .hud__meta { white-space: nowrap; }

  .hud--bottom {
    flex-wrap: wrap;
    gap: 0.9rem 1.6rem;
    color: var(--muted);
  }

  .hud__hint {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }

  kbd {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.28em 0.5em;
    background: rgba(255, 255, 255, 0.03);
  }

  /* 版本号固定在窗口右下角，不随画廊/详情页内容滚动；偏移量对齐 .hud 内边距 */
  .hud__build {
    position: fixed;
    right: clamp(1.4rem, 4.5vw, 3.4rem);
    bottom: 1.9rem;
    z-index: 2;
    pointer-events: none;
  }

  /* ---------- 主舞台 ---------- */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem clamp(1.4rem, 5vw, 5rem) 2.5rem;
  }

  /* 标题菜单与体素方块作为一组整体居中，避免宽屏下内容分散到两侧 */
  .layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 6vw, 6rem);
    width: 100%;
    max-width: 1280px;
  }

  .hero {
    min-width: 0;
  }

  .eyebrow {
    margin: 0 0 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--mint);
  }

  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: var(--mint);
  }

  .title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(4rem, 12vw, 11rem);
    line-height: 0.84;
    letter-spacing: 0.015em;
    color: var(--mint-bright);
    background: linear-gradient(178deg, #f6fbf0 8%, var(--mint) 62%, var(--mint-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    /* 用 filter 绘制立体挤出，text-shadow 会把文字填色压暗 */
    filter:
      drop-shadow(2px 2px 0 #1b1913)
      drop-shadow(2px 2px 0 #15140f)
      drop-shadow(2px 2px 0 #100f0b)
      drop-shadow(0 16px 28px rgba(0, 0, 0, 0.5));
  }

  .lede {
    margin: 1.55rem 0 0;
    max-width: 30rem;
    text-wrap: pretty;
    font-size: clamp(0.95rem, 1.15vw, 1.05rem);
    line-height: 1.75;
    color: #c6c0b4;
  }

  /* ---------- 菜单 ---------- */
  .menu {
    margin-top: clamp(2rem, 4.5vh, 3.2rem);
    width: min(100%, 480px);
    border-top: 1px solid var(--line);
  }

  .menu__item {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 1.05rem 0.35rem;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    overflow: hidden;
    transition: color 0.22s ease, padding-left 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* 悬停时从左侧铺开的薄荷色填充 */
  .menu__item::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(90deg, var(--mint) 0%, var(--mint-deep) 100%);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .menu__item > * { position: relative; z-index: 1; }

  .menu__index {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--mint-deep);
    transition: color 0.22s ease;
  }

  .menu__label {
    font-family: var(--font-display);
    font-size: clamp(1.15rem, 2.1vw, 1.5rem);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .menu__arrow {
    font-family: var(--font-mono);
    font-size: 1rem;
    /* 右侧留出边距，悬停右移后不贴边 */
    padding-right: 0.75rem;
    color: var(--mint);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.22s ease;
  }

  .menu__item:hover,
  .menu__item:focus-visible {
    color: var(--dark);
    padding-left: 0.85rem;
    /* 键盘焦点与鼠标悬停共用高亮，不额外绘制焦点外框。 */
    outline: none;
  }

  .menu__item:hover::after,
  .menu__item:focus-visible::after { transform: scaleX(1); }

  .menu__item:hover .menu__index,
  .menu__item:focus-visible .menu__index,
  .menu__item:hover .menu__arrow,
  .menu__item:focus-visible .menu__arrow {
    color: var(--dark);
  }

  .menu__item:hover .menu__arrow,
  .menu__item:focus-visible .menu__arrow { transform: translateX(5px); }

  .status {
    margin: 1.35rem 0 0;
    min-height: 1.2em;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  /* ---------- 页面切换：主菜单 / 模型画廊 / 模型详情 ---------- */
  /* 非当前页面整体隐藏；激活页面播放统一淡入，节奏对齐 menu.motion */
  .screen:not(.is-active) { display: none; }

  .screen.is-active {
    animation: screen-in 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* 入场只动透明度：带 transform 的祖先会接管 fixed 子元素的定位参照，
     导致固定标题栏在动画期间相对 .screen 定位、结束后跳回窗口，产生位移抖动 */
  @keyframes screen-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---------- 返回栏：返回按钮 + 操作提示 ---------- */
  /* 固定在窗口顶部，不随内容滚动；背景与分隔线遮住下方穿过的文字 */
  .backbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px clamp(1.4rem, 5vw, 5rem);
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--dark);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: color 220ms ease, background 220ms ease, border-color 220ms ease;
  }

  .back:hover,
  .back:focus-visible {
    color: var(--dark);
    background: var(--mint);
    border-color: var(--mint);
    outline: none;
  }

  .back__arrow {
    font-size: 0.95rem;
    line-height: 1;
  }

  /* 悬停填充变亮后，kbd 描边与文字同步换深色，保持可读 */
  .back:hover kbd,
  .back:focus-visible kbd {
    color: var(--dark);
    border-color: rgba(18, 17, 13, 0.4);
  }

  /* ---------- 模型画廊 ---------- */
  .gallery {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    /* 预留固定标题栏高度，避免内容被遮挡 */
    padding-top: 88px;
  }

  .gallery__head {
    margin-bottom: 48px;
  }

  .gallery__title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.25rem, 4.5vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: 0.02em;
    background: linear-gradient(178deg, #f6fbf0 8%, var(--mint) 62%, var(--mint-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .gallery__lede {
    margin: 16px 0 0;
    max-width: 42rem;
    font-size: 1.125rem;
    line-height: 1.6;
    color: #c6c0b4;
    text-wrap: pretty;
  }

  .gallery__section {
    margin-top: 56px;
  }

  .gallery__section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .gallery__index {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--mint-deep);
  }

  .gallery__name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .gallery__count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
    gap: 24px;
  }

  /* ---------- 模型卡片 ---------- */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 20px 18px;
    text-align: left;
    color: var(--ink);
    background: var(--dark);
    border: 1px solid var(--line);
    cursor: pointer;
    overflow: hidden;
    transition: border-color 220ms ease;
  }

  /* 底部薄荷线：悬停/焦点时从左铺开，对齐菜单填充节奏 */
  .card::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--mint);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .card:hover,
  .card:focus-visible {
    border-color: var(--outline-accent);
    outline: none;
  }

  .card:hover::after,
  .card:focus-visible::after {
    transform: scaleX(1);
  }

  .card__stage {
    display: block;
    position: relative;
    height: 180px;
    perspective: 600px;
    background: radial-gradient(70% 55% at 50% 62%, rgba(200, 219, 177, 0.07), transparent 70%);
  }

  .card__info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card__index {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--mint-deep);
  }

  .card__name {
    font-family: var(--font-display);
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    transition: color 220ms ease;
  }

  .card:hover .card__name,
  .card:focus-visible .card__name {
    color: var(--mint-bright);
  }

  .card__meta {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- 体素占位模型：CSS 3D 盒子组合 ---------- */
  /* 模型原点在舞台中心，各盒子按 (x, y, z) 偏移组合出部件轮廓 */
  .model {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    transform: scale(var(--model-scale, 1)) rotateX(-14deg) rotateY(0deg);
  }

  /* 画廊卡片内缓慢自转，各卡片用负延迟错开相位 */
  .model--spin {
    animation: model-spin 16s linear infinite;
  }

  @keyframes model-spin {
    from { transform: scale(var(--model-scale, 1)) rotateX(-14deg) rotateY(0deg); }
    to { transform: scale(var(--model-scale, 1)) rotateX(-14deg) rotateY(360deg); }
  }

  .model__box {
    position: absolute;
    transform-style: preserve-3d;
  }

  .model__face {
    position: absolute;
  }

  /* ---------- 模型详情 ---------- */
  .detail {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    /* 预留固定标题栏高度，避免内容被遮挡 */
    padding-top: 88px;
  }

  /* 查看区：指针拖拽旋转（yaw/pitch），滚轮缩放 */
  .viewer {
    position: relative;
    height: min(48vh, 420px);
    perspective: 1000px;
    cursor: grab;
    touch-action: none;
    border: 1px solid var(--line);
    background-color: var(--dark);
    background-image:
      linear-gradient(rgba(200, 219, 177, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 219, 177, 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .viewer.is-dragging {
    cursor: grabbing;
  }

  /* 三维尺寸信息：名称 + 宽/高/深三组读数 */
  .specs {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 24px 56px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .specs__id {
    flex: 1 1 240px;
    min-width: 0;
  }

  .specs__name {
    margin: 8px 0 0;
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.02em;
  }

  .spec {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .spec__label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .spec__row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .spec__value {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--mint-bright);
    font-variant-numeric: tabular-nums;
  }

  .spec__unit {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .layout { gap: 0; }
    .voxels { display: none; }
  }

  @media (max-width: 640px) {
    .hud { padding: 1.3rem 1.2rem; font-size: 0.6rem; }
    .hud__meta { display: none; }
    .stage { padding: 1.5rem 1.4rem 2rem; }
    .title { font-size: clamp(3.4rem, 20vw, 5rem); }
    .lede { margin-top: 1.1rem; font-size: 0.92rem; }
    .menu { margin-top: 1.8rem; }
    .menu__item { padding: 0.95rem 0.2rem; }
    .menu__label { font-size: 1.1rem; }
    .hud--bottom { padding-bottom: 1.6rem; }
    .hud__build { right: 1.2rem; bottom: 1.6rem; }
    .backbar { padding: 14px 1.2rem; }
    .back { padding: 12px 14px; }
    .gallery { padding-top: 74px; }
    .detail { padding-top: 74px; }
    .gallery__head { margin-bottom: 32px; }
    .gallery__section { margin-top: 40px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { padding: 16px 14px 14px; }
    .card__stage { height: 140px; }
    .viewer { height: min(42vh, 320px); }
    .specs { gap: 20px 32px; margin-top: 24px; }
    .specs__name { font-size: 1.4rem; }
    .spec__value { font-size: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .drift { animation: none; }
    .model--spin { animation: none; }
    .screen.is-active { animation: none; }
    .card,
    .card::after,
    .card .card__name,
    .back,
    .back kbd { transition: none; }
    .menu__item,
    .menu__item::after,
    .menu__item .menu__arrow { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__glow"></div>
    <div class="bg__floor"></div>
    <div class="bg__scan"></div>
    <div class="bg__vignette"></div>
  </div>

  <div class="frame" aria-hidden="true"></div>

  <header class="hud hud--top">


  </header>

  <main class="stage">
    <!-- 主菜单：标题、菜单与体素装饰 -->
    <div class="layout screen is-active" id="screen-menu">
      <section class="hero">

      <h1 class="title">V-Tank</h1>


      <nav class="menu" aria-label="主菜单">
        <a class="menu__item" href="#start">
          <span class="menu__index">01</span>
          <span class="menu__label">开始游戏</span>
          <span class="menu__arrow" aria-hidden="true">→</span>
        </a>
        <a class="menu__item" href="#gallery">
          <span class="menu__index">02</span>
          <span class="menu__label">模型画廊</span>
          <span class="menu__arrow" aria-hidden="true">→</span>
        </a>
      </nav>

      <p class="status" role="status" aria-live="polite"><kbd>↑</kbd> <kbd>↓</kbd> 选择 · <kbd>ENTER</kbd> 确认</p>
      </section>

      <svg class="voxels" viewBox="90 95 470 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <g id="cube-mint">
            <polygon points="0,0 34,17 0,34 -34,17" fill="#e2edcf"></polygon>
            <polygon points="-34,17 0,34 0,72 -34,55" fill="#b7cb9f"></polygon>
            <polygon points="0,34 34,17 34,55 0,72" fill="#91a97a"></polygon>
          </g>
          <g id="cube-gray">
            <polygon points="0,0 34,17 0,34 -34,17" fill="#d8dbd8"></polygon>
            <polygon points="-34,17 0,34 0,72 -34,55" fill="#b0b5b2"></polygon>
            <polygon points="0,34 34,17 34,55 0,72" fill="#868c89"></polygon>
          </g>
          <g id="cube-sand">
            <polygon points="0,0 34,17 0,34 -34,17" fill="#8b7660"></polygon>
            <polygon points="-34,17 0,34 0,72 -34,55" fill="#6d5b49"></polygon>
            <polygon points="0,34 34,17 34,55 0,72" fill="#524437"></polygon>
          </g>
          <g id="cube-dark">
            <polygon points="0,0 34,17 0,34 -34,17" fill="#3a3830"></polygon>
            <polygon points="-34,17 0,34 0,72 -34,55" fill="#2c2a24"></polygon>
            <polygon points="0,34 34,17 34,55 0,72" fill="#211f1a"></polygon>
          </g>
        </defs>

        <g transform="translate(330 210) scale(1.15)">
          <g class="drift" style="animation-delay: -2.4s"><use href="#cube-mint"></use></g>
        </g>
        <g transform="translate(440 300) scale(0.75)">
          <g class="drift" style="animation-delay: -4.1s"><use href="#cube-gray"></use></g>
        </g>
        <g transform="translate(250 330) scale(0.9)">
          <g class="drift" style="animation-delay: -0.8s"><use href="#cube-sand"></use></g>
        </g>
        <g transform="translate(160 220) scale(0.45)" opacity="0.55">
          <g class="drift" style="animation-delay: -5.3s"><use href="#cube-gray"></use></g>
        </g>
        <g transform="translate(400 150) scale(0.4)" opacity="0.6">
          <g class="drift" style="animation-delay: -3.2s"><use href="#cube-mint"></use></g>
        </g>
        <g transform="translate(486 190) scale(0.5)" opacity="0.5">
          <g class="drift" style="animation-delay: -1.6s"><use href="#cube-dark"></use></g>
        </g>
        <g transform="translate(530 330) scale(0.3)" opacity="0.35">
          <g class="drift" style="animation-delay: -6s"><use href="#cube-mint"></use></g>
        </g>
        <g transform="translate(120 330) scale(0.35)" opacity="0.4">
          <g class="drift" style="animation-delay: -2s"><use href="#cube-sand"></use></g>
        </g>
        <g transform="translate(300 118) scale(0.3)" opacity="0.4">
          <g class="drift" style="animation-delay: -4.7s"><use href="#cube-gray"></use></g>
        </g>
      </svg>
    </div>
    </div>

    <!-- 模型画廊：炮管 / 履带 / 车身 / 坦克 四个栏目，网格内模型缓慢自转 -->
    <div class="screen" id="screen-gallery">
      <div class="gallery">
        <div class="backbar">
          <button class="back" type="button" id="gallery-back" aria-label="返回主菜单">
            <span class="back__arrow" aria-hidden="true">←</span> <kbd>ESC</kbd>
          </button>
        </div>

        <header class="gallery__head">
          <h2 class="gallery__title">模型画廊</h2>
          <p class="gallery__lede">按部件分类浏览当前可用模型：炮管、履带、车身、坦克。每个模型缓慢自转便于查看，点击进入查看页后可用鼠标拖拽旋转、滚轮缩放。</p>
        </header>

        <div id="gallery-sections"></div>
      </div>
    </div>

    <!-- 模型详情：鼠标拖拽旋转查看，下方展示三维尺寸 -->
    <div class="screen" id="screen-detail">
      <div class="detail">
        <div class="backbar">
          <button class="back" type="button" id="detail-back" aria-label="返回模型画廊">
            <span class="back__arrow" aria-hidden="true">←</span> <kbd>ESC</kbd>
          </button>
        </div>

        <div class="viewer" id="viewer" aria-label="模型查看区，按住鼠标拖拽可旋转模型"></div>

        <div class="specs">
          <div class="specs__id">
            <p class="eyebrow" id="detail-cat">坦克</p>
            <h2 class="specs__name" id="detail-name">—</h2>
          </div>
          <div class="spec">
            <span class="spec__label">长度</span>
            <span class="spec__row"><span class="spec__value" id="detail-len">0</span><span class="spec__unit">米</span></span>
          </div>
          <div class="spec">
            <span class="spec__label">宽度</span>
            <span class="spec__row"><span class="spec__value" id="detail-w">0</span><span class="spec__unit">米</span></span>
          </div>
          <div class="spec">
            <span class="spec__label">高度</span>
            <span class="spec__row"><span class="spec__value" id="detail-h">0</span><span class="spec__unit">米</span></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="hud hud--bottom">
    <span class="hud__hint"></span>
    <span class="hud__hint"></span>
    <span class="hud__build">版本 0.1.0</span>
  </footer>

  <script>
    (() => {
      const items = [...document.querySelectorAll('.menu__item')];

      // 方向键在主菜单内循环移动焦点，符合手柄/键盘操作习惯
      document.addEventListener('keydown', (event) => {
        if (!screens.menu.classList.contains('is-active')) return;
        if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
        event.preventDefault();
        const activeIndex = items.indexOf(document.activeElement);
        if (activeIndex === -1) {
          items[0].focus();
          return;
        }
        const step = event.key === 'ArrowDown' ? 1 : -1;
        items[(activeIndex + step + items.length) % items.length].focus();
      });

      // ---------- 页面切换：主菜单 / 模型画廊 / 模型详情 ----------
      const screens = {
        menu: document.getElementById('screen-menu'),
        gallery: document.getElementById('screen-gallery'),
        detail: document.getElementById('screen-detail'),
      };

      // 切换当前页面；非激活页面 display:none，激活页面播放统一淡入
      function showScreen(name) {
        for (const [key, el] of Object.entries(screens)) {
          el.classList.toggle('is-active', key === name);
        }
      }

      // ---------- 体素占位模型：CSS 3D 盒子组合出部件轮廓 ----------
      // 三面色阶：顶面亮、正面中、侧面暗，模拟体素三面明暗
      const TONES = {
        mint: ['#e2edcf', '#b7cb9f', '#91a97a'],
        gray: ['#d8dbd8', '#b0b5b2', '#868c89'],
        sand: ['#8b7660', '#6d5b49', '#524437'],
        dark: ['#3a3830', '#2c2a24', '#211f1a'],
      };

      // 单个盒子面：w/h 为面尺寸（px），transform 负责摆到盒子对应方位
      function face(w, h, transform, color) {
        const el = document.createElement('div');
        el.className = 'model__face';
        el.style.cssText =
          `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px;` +
          `transform:${transform};background:${color};`;
        return el;
      }

      // 组合模型：parts 里每个盒子以模型中心为原点偏移 (x, y, z)
      function buildModel(model) {
        const el = document.createElement('div');
        el.className = 'model';
        el.setAttribute('aria-hidden', 'true');
        for (const part of model.parts) {
          const box = document.createElement('div');
          box.className = 'model__box';
          const x = part.x || 0;
          const y = part.y || 0;
          const z = part.z || 0;
          box.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
          const [light, mid, dark] = TONES[part.tone || model.tone];
          const hw = part.w / 2;
          const hh = part.h / 2;
          const hd = part.d / 2;
          box.append(
            face(part.w, part.h, `translateZ(${hd}px)`, mid),
            face(part.w, part.h, `rotateY(180deg) translateZ(${hd}px)`, dark),
            face(part.d, part.h, `rotateY(-90deg) translateZ(${hw}px)`, dark),
            face(part.d, part.h, `rotateY(90deg) translateZ(${hw}px)`, dark),
            face(part.w, part.d, `rotateX(90deg) translateZ(${hh}px)`, light),
            face(part.w, part.d, `rotateX(-90deg) translateZ(${hh}px)`, dark),
          );
          el.append(box);
        }
        return el;
      }

      // ---------- 模型数据 ----------
      // dims 为三维尺寸 [长, 宽, 高]（米）；parts 为占位模型盒子组合（px）
      const CATEGORIES = [
        {
          name: '炮管', code: 'BR',
          models: [
            {
              name: '长管加农', tone: 'gray', dims: [7, 1, 1],
              parts: [
                { w: 170, h: 16, d: 16 },
                { w: 30, h: 28, d: 28, x: -86, tone: 'dark' },
                { w: 12, h: 22, d: 22, x: 88, tone: 'dark' },
              ],
            },
            {
              name: '短管榴弹', tone: 'gray', dims: [4, 1.5, 1.5],
              parts: [
                { w: 96, h: 24, d: 24 },
                { w: 18, h: 32, d: 32, x: 46, tone: 'dark' },
                { w: 34, h: 36, d: 36, x: -52, tone: 'dark' },
              ],
            },
            {
              name: '双联机炮', tone: 'mint', dims: [4, 2, 1.5],
              parts: [
                { w: 116, h: 12, d: 12, z: 15 },
                { w: 116, h: 12, d: 12, z: -15 },
                { w: 30, h: 30, d: 52, x: -60, tone: 'dark' },
              ],
            },
          ],
        },
        {
          name: '履带', code: 'TR',
          models: [
            {
              name: '标准履带', tone: 'sand', dims: [4.5, 3, 1.5],
              parts: [
                { w: 168, h: 30, d: 24, z: 36 },
                { w: 168, h: 30, d: 24, z: -36 },
                { w: 120, h: 10, d: 60, y: -20, tone: 'dark' },
              ],
            },
            {
              name: '宽履带', tone: 'sand', dims: [4.5, 3.5, 1.5],
              parts: [
                { w: 168, h: 26, d: 34, z: 46 },
                { w: 168, h: 26, d: 34, z: -46 },
                { w: 110, h: 10, d: 70, y: -18, tone: 'dark' },
              ],
            },
            {
              name: '轻型履带', tone: 'gray', dims: [3.5, 2.5, 1],
              parts: [
                { w: 128, h: 22, d: 18, z: 28 },
                { w: 128, h: 22, d: 18, z: -28 },
              ],
            },
          ],
        },
        {
          name: '车身', code: 'CH',
          models: [
            {
              name: '标准底盘', tone: 'gray', dims: [4, 2.5, 1.5],
              parts: [
                { w: 150, h: 38, d: 92 },
                { w: 112, h: 12, d: 66, y: -25, tone: 'dark' },
                { w: 16, h: 24, d: 88, x: 80, tone: 'dark' },
              ],
            },
            {
              name: '装甲底盘', tone: 'sand', dims: [4.5, 3, 2],
              parts: [
                { w: 150, h: 48, d: 98 },
                { w: 116, h: 16, d: 72, y: -30, tone: 'dark' },
                { w: 18, h: 30, d: 92, x: 80, tone: 'dark' },
              ],
            },
          ],
        },
        {
          name: '坦克', code: 'TK',
          models: [
            {
              name: '侦察型', tone: 'mint', dims: [4.5, 2.5, 2],
              parts: [
                { w: 132, h: 32, d: 84 },
                { w: 58, h: 24, d: 52, y: -28, tone: 'gray' },
                { w: 84, h: 10, d: 10, x: 70, y: -28, tone: 'dark' },
              ],
            },
            {
              name: '主战型', tone: 'gray', dims: [7, 3.5, 2.5],
              parts: [
                { w: 156, h: 40, d: 100 },
                { w: 76, h: 30, d: 66, y: -35, tone: 'mint' },
                { w: 104, h: 13, d: 13, x: 92, y: -35, tone: 'dark' },
                { w: 14, h: 18, d: 18, x: 142, y: -35, tone: 'dark' },
              ],
            },
            {
              name: '重装型', tone: 'sand', dims: [7.5, 4, 3],
              parts: [
                { w: 164, h: 48, d: 112 },
                { w: 88, h: 36, d: 78, y: -42, tone: 'dark' },
                { w: 108, h: 12, d: 12, x: 96, y: -46, z: 12, tone: 'dark' },
                { w: 108, h: 12, d: 12, x: 96, y: -46, z: -12, tone: 'dark' },
              ],
            },
          ],
        },
      ];

      // ---------- 画廊渲染：栏目 + 网格卡片，卡片内模型慢速自转 ----------
      const gallerySections = document.getElementById('gallery-sections');
      const firstCards = [];

      CATEGORIES.forEach((category, ci) => {
        const section = document.createElement('section');
        section.className = 'gallery__section';

        const head = document.createElement('div');
        head.className = 'gallery__section-head';
        head.innerHTML =
          `<span class="gallery__index">${String(ci + 1).padStart(2, '0')}</span>` +
          `<h3 class="gallery__name">${category.name}</h3>` +
          `<span class="gallery__count">${category.models.length} 个模型</span>`;
        section.append(head);

        const grid = document.createElement('div');
        grid.className = 'grid';

        category.models.forEach((model, mi) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'card';
          card.innerHTML =
            `<span class="card__stage"></span>` +
            `<span class="card__info">` +
            `<span class="card__index">${category.code}-${String(mi + 1).padStart(2, '0')}</span>` +
            `<span class="card__name">${model.name}</span>` +
            `<span class="card__meta">${model.dims.join(' × ')} 米</span>` +
            `</span>`;

          // 卡片内缩小展示并慢速自转；负延迟让各卡片错开相位
          const spin = buildModel(model);
          spin.classList.add('model--spin');
          spin.style.setProperty('--model-scale', '0.62');
          spin.style.animationDelay = `${-3 - mi * 2.6}s`;
          card.querySelector('.card__stage').append(spin);

          card.addEventListener('click', () => openDetail(model, category, card));
          grid.append(card);
        });

        section.append(grid);
        gallerySections.append(section);
        firstCards.push(grid.querySelector('.card'));
      });

      // ---------- 模型详情页：拖拽旋转 + 滚轮缩放 ----------
      const viewer = document.getElementById('viewer');
      const detailCat = document.getElementById('detail-cat');
      const detailName = document.getElementById('detail-name');
      const detailDims = [
        document.getElementById('detail-len'),
        document.getElementById('detail-w'),
        document.getElementById('detail-h'),
      ];

      let yaw = -28;
      let pitch = -14;
      let zoom = 1.5;
      let detailModel = null;
      let lastCard = null;

      // 详情页模型由 JS 直接写 transform，缩放与旋转合并应用
      function renderDetailModel() {
        if (!detailModel) return;
        detailModel.style.transform =
          `scale(${zoom}) rotateX(${pitch}deg) rotateY(${yaw}deg)`;
      }

      function openDetail(model, category, card) {
        lastCard = card;
        detailCat.textContent = category.name;
        detailName.textContent = model.name;
        model.dims.forEach((value, i) => { detailDims[i].textContent = value; });

        // 重置为三分之四初始视角，替换查看区内的模型
        yaw = -28;
        pitch = -14;
        zoom = 1.5;
        detailModel = buildModel(model);
        viewer.replaceChildren(detailModel);
        renderDetailModel();

        showScreen('detail');
        document.getElementById('detail-back').focus();
      }

      // 指针拖拽：水平改 yaw，垂直改 pitch（限位防止翻面丢失立体感）
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      viewer.addEventListener('pointerdown', (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        viewer.classList.add('is-dragging');
        viewer.setPointerCapture(event.pointerId);
      });

      viewer.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        yaw += (event.clientX - lastX) * 0.45;
        pitch = Math.max(-80, Math.min(80, pitch - (event.clientY - lastY) * 0.45));
        lastX = event.clientX;
        lastY = event.clientY;
        renderDetailModel();
      });

      function endDrag(event) {
        dragging = false;
        viewer.classList.remove('is-dragging');
        if (event.pointerId !== undefined && viewer.hasPointerCapture(event.pointerId)) {
          viewer.releasePointerCapture(event.pointerId);
        }
      }

      viewer.addEventListener('pointerup', endDrag);
      viewer.addEventListener('pointercancel', endDrag);

      // 滚轮缩放，限制在可读范围内
      viewer.addEventListener('wheel', (event) => {
        event.preventDefault();
        zoom = Math.max(0.8, Math.min(2.4, zoom * (event.deltaY > 0 ? 0.92 : 1.08)));
        renderDetailModel();
      }, { passive: false });

      // ---------- 导航：点击与 ESC 共用同一返回路径 ----------
      const galleryLink = document.querySelector('.menu__item[href="#gallery"]');
      const galleryBack = document.getElementById('gallery-back');
      const detailBack = document.getElementById('detail-back');

      function openGallery() {
        showScreen('gallery');
        // 焦点落到首个模型卡片，方便进入后直接方向/回车浏览
        firstCards[0]?.focus();
      }

      function backToGallery() {
        showScreen('gallery');
        (lastCard || firstCards[0])?.focus();
      }

      function backToMenu() {
        showScreen('menu');
        galleryLink.focus();
      }

      galleryLink.addEventListener('click', (event) => {
        event.preventDefault();
        openGallery();
      });
      galleryBack.addEventListener('click', backToMenu);
      detailBack.addEventListener('click', backToGallery);

      // ESC 逐级返回：详情 → 画廊 → 主菜单
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (screens.detail.classList.contains('is-active')) backToGallery();
        else if (screens.gallery.classList.contains('is-active')) backToMenu();
      });
    })();
  </script>


</body></html>
