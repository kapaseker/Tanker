[package]
name = "tanker"
version = "0.1.0"
edition = "2024"

[dependencies]
# 基于 crates.io 的 bevy 0.20（不使用父目录源码）。
# 与 bevy_vox_scene 0.23、轨道相机 0.36 和 Avian 0.8 同步升级。
# 系统缺 alsa/udev/wayland 的开发包，故禁用默认特性，手工组装：
#   - 禁 audio（需要 alsa）与 bevy_gilrs（需要 udev）
#   - 禁 wayland，仅保留 x11（当前会话为 X11，winit 走 dlopen 无需头文件）
bevy = { version = "0.20", default-features = false, features = [
  # default_app
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "reflect_auto_register",
  # 平台（无 gilrs / wayland / webgl / sysinfo）
  "multi_threaded",
  "bevy_winit",
  "x11",
  "default_font",
  # 字体资产加载与文本排版（Font / FontLoader）
  "bevy_text",
  # 主菜单 2D 界面（节点布局、文本、Interaction 拾取）
  "bevy_ui",
  # 0.20 起 UI 渲染独立成插件（bevy_ui 只含布局/焦点），缺它则 UI 完全不可见
  "bevy_ui_render",
  # 离屏关键帧使用 PNG 编码；复用 Bevy 已有图像依赖。
  "png",
  # 3D 渲染管线
  "3d_api",
  "3d_bevy_render",
] }

# MagicaVoxel .vox 场景加载（场景图 + 材质/玻璃/云体素），兼容表：bevy 0.20 <-> 0.23
bevy_vox_scene = "0.23"

# 爆炸逐帧动画的速度组件 FlipbookSpeed 只在此 crate 导出（vox_scene 未重导出）；
# 该 crate 的 lib 名是 flipbook（非 bevy_flipbook），重命名对齐其真实 lib 名。
flipbook = { version = "0.1", package = "bevy_flipbook" }

# 轨道相机：左键旋转、滚轮缩放，位置由驾驶模块自动跟随，兼容 Bevy 0.20
bevy_panorbit_camera = "0.36"

# 简化坦克刚体与平面碰撞；0.8 对应 Bevy 0.20，仅启用 3D 单精度碰撞后端。
# 注意：0.8 移除了独立 f32 特性（f32 成为默认，仅 f64 需显式启用）。
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32"] }

# 开局随机摆放敌人；复用依赖树中已锁定的随机库。
fastrand = "2"

# 字体光学度量（hhea/OS2 表）解析；与 parley 传递依赖同版本，零新增编译成本。
read-fonts = "0.41"

# Bevy 官方推荐的 dev 性能配置：自身轻度优化，依赖全量优化，保证运行流畅
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
